name: ton-kho-da-dich-vu

services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_pw}
    ports:
      - "${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
      POSTGRES_USER: ${ORDER_DB_USER:-order}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pw}
    ports:
      - "${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__InventoryDb: Host=inventory-db;Port=5432;Database=${INVENTORY_DB_NAME:-inventory_db};Username=${INVENTORY_DB_USER:-inventory};Password=${INVENTORY_DB_PASSWORD:-inventory_pw}
    ports:
      - "${INVENTORY_HTTP_PORT:-5010}:8080"
      - "${INVENTORY_GRPC_PORT:-5011}:8081"
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Urls: http://0.0.0.0:8080
      Services__InventoryGrpcUrl: http://inventory-service:8081
      ConnectionStrings__OrderDb: Host=order-db;Port=5432;Database=${ORDER_DB_NAME:-order_db};Username=${ORDER_DB_USER:-order};Password=${ORDER_DB_PASSWORD:-order_pw}
    ports:
      - "${ORDER_API_PORT:-5020}:8080"
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_started
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  inventory-db-data:
  order-db-data:
